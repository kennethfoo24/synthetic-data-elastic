# k8s/databases/mongodb-init.yaml
#
# One-shot Job to initialise the MongoDB rs0 replica set.
# Applied AFTER both StatefulSet rollouts complete — the Job polls until both
# members are up before calling rs.initiate().
#
# Split from mongodb.yaml so deploy.sh can sequence correctly:
#   1. Apply mongodb.yaml (Services + StatefulSets)
#   2. Wait for all StatefulSet rollouts
#   3. Delete any stale mongodb-init Job, then apply this file
#   4. Wait for Job completion
#
# The mongodb-init Job is idempotent: it checks rs.status() before calling
# rs.initiate(), so re-applying this manifest is safe.  Use `make reset-databases`
# if a primary pod restart has left the replica set in an inconsistent state.
---
# mongodb-init: one-shot Job that forms the rs0 replica set.
# Runs rs.initiate() only when the replica set is not yet configured.
# ttlSecondsAfterFinished cleans up the completed pod after 10 minutes.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: synthetic-network
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongosh
          image: mongo:7
          command:
            - bash
            - -c
            - |
              set -e
              echo "==> Waiting for mongodb-prod..."
              until mongosh --host mongodb-prod --quiet \
                --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q "^1$"; do
                sleep 3
              done
              echo "==> Waiting for mongodb-dr..."
              until mongosh --host mongodb-dr --quiet \
                --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q "^1$"; do
                sleep 3
              done
              echo "==> Both members ready. Checking replica set status..."
              RS_OK=$(mongosh --host mongodb-prod --quiet \
                --eval "try { rs.status().ok } catch(e) { 0 }" 2>/dev/null | tail -1)
              if [ "$RS_OK" = "1" ]; then
                echo "==> Replica set rs0 already initialized — nothing to do."
              else
                echo "==> Initiating replica set rs0..."
                mongosh --host mongodb-prod --eval '
                  var cfg = {
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongodb-prod:27017", priority: 1 },
                      { _id: 1, host: "mongodb-dr:27017",   priority: 0 }
                    ]
                  };
                  printjson(rs.initiate(cfg));
                '
              fi
              echo "==> Done."
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
