# k8s/databases/mongodb.yaml
#
# Two-member MongoDB replica set (rs0) for the synthetic-data lab.
#
# Security note — authless (no keyFile):
#   Replica-set keyFile authentication is omitted intentionally.  The
#   synthetic-network namespace is the security boundary; no service is
#   exposed outside the cluster.  Adding keyFile auth in a lab where the
#   keyfile would be stored in a plain ConfigMap provides no meaningful
#   security uplift and complicates the init job significantly.
#
# Durability limitation (emptyDir):
#   Both members use emptyDir for /data/db.  On pod restart the data directory
#   is cleared.  The replica set configuration (replicaSetId) is also cleared,
#   so a restart of mongodb-prod causes a replicaSetId mismatch on the
#   secondary — the replica set must be re-initialised from scratch.
#   Run `make reset-databases` to delete both pods and the init job and re-run
#   the bootstrap sequence in the correct order.  For a synthetic lab that
#   regenerates data continuously this is an acceptable trade-off.
#
# Members
#   mongodb-prod  —  primary  (priority 1)
#   mongodb-dr    —  secondary (priority 0, will never be elected primary)
#
# The mongodb-init Job (k8s/databases/mongodb-init.yaml) is applied separately
# after StatefulSet rollouts complete — see deploy.sh for sequencing details.
---
# Headless Service for mongodb-prod — provides stable DNS for the StatefulSet
# and is the target hosts entry in the Fleet mongodb integration.
apiVersion: v1
kind: Service
metadata:
  name: mongodb-prod
  namespace: synthetic-network
spec:
  clusterIP: None
  selector:
    app: mongodb-prod
  ports:
    - port: 27017
      targetPort: 27017
---
# Headless Service for mongodb-dr — same purpose for the secondary member.
apiVersion: v1
kind: Service
metadata:
  name: mongodb-dr
  namespace: synthetic-network
spec:
  clusterIP: None
  selector:
    app: mongodb-dr
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-prod
  namespace: synthetic-network
spec:
  serviceName: mongodb-prod
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-prod
  template:
    metadata:
      labels:
        app: mongodb-prod
    spec:
      containers:
        - name: mongod
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          # 768Mi: mongod ~200-350Mi + mongosh readiness probe (Node.js, ~250-300Mi)
          # can overlap briefly; 512Mi was tight enough to risk OOM on probe execution.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
# mongodb-dr: secondary with priority 0 — will receive replication traffic but
# will never be elected primary, ensuring the prod instance stays authoritative.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-dr
  namespace: synthetic-network
spec:
  serviceName: mongodb-dr
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-dr
  template:
    metadata:
      labels:
        app: mongodb-dr
    spec:
      containers:
        - name: mongod
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          # 768Mi: same reasoning as mongodb-prod above.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
