# This file is used for CI validation only (kubectl kustomize k8s/ >/dev/null).
# deploy.sh is the canonical deployment path — it handles SHA pinning of the
# synthetic-netgen image and creates the elastic-credentials secret from .env.
# Do NOT use kubectl apply -k k8s/ directly; it deploys :latest and skips secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - databases/mongodb.yaml
  - databases/mongodb-init.yaml
  - databases/postgres.yaml
  - jobs/fleet-setup.yaml
  - elastic-agent.yaml
  - generators/syslog-gen.yaml
  - generators/syslog-ios-gen.yaml
  - generators/syslog-panw-gen.yaml
  - generators/syslog-meraki-gen.yaml
  - generators/meraki-webhook-gen.yaml
  - generators/netflow-gen.yaml
  - generators/snmpsim.yaml
  - generators/db-workload.yaml
  - logstash/logstash.yaml
