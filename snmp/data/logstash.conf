# Auto-generated by snmp/generator/render.py — re-run after updating topology.
# Community string = device name; snmpsim selects <device-name>.snmprec per request.
input {
  snmp {
    hosts => [
    { host => "udp:snmpsim/161" community => "cisco-asa-dr" version => "2c" },
    { host => "udp:snmpsim/161" community => "cisco-rtr-core-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "cisco-rtr-core-02" version => "2c" },
    { host => "udp:snmpsim/161" community => "cisco-rtr-dr" version => "2c" },
    { host => "udp:snmpsim/161" community => "cisco-sw-access-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "cisco-sw-access-02" version => "2c" },
    { host => "udp:snmpsim/161" community => "cisco-sw-access-03" version => "2c" },
    { host => "udp:snmpsim/161" community => "cisco-sw-dr-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "dell-srv-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "dell-srv-02" version => "2c" },
    { host => "udp:snmpsim/161" community => "dell-storage-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "dell-storage-dr" version => "2c" },
    { host => "udp:snmpsim/161" community => "dell-sw-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "dell-sw-dr" version => "2c" },
    { host => "udp:snmpsim/161" community => "hpe-srv-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "hpe-srv-02" version => "2c" },
    { host => "udp:snmpsim/161" community => "hpe-srv-dr-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "hpe-storage-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "hpe-sw-01" version => "2c" },
    { host => "udp:snmpsim/161" community => "palo-fw-prod" version => "2c" }
    ]
    get => [
      "1.3.6.1.2.1.1.1.0",          # sysDescr
      "1.3.6.1.2.1.1.2.0",          # sysObjectID
      "1.3.6.1.2.1.1.3.0",          # sysUpTime
      "1.3.6.1.2.1.1.5.0",          # sysName
      "1.3.6.1.2.1.1.6.0",          # sysLocation
      "1.3.6.1.2.1.25.2.3.1.5.1",  # hrStorageSize
      "1.3.6.1.2.1.25.2.3.1.6.1",  # hrStorageUsed
      "1.3.6.1.2.1.25.3.3.1.2.1",  # hrProcessorLoad
      "1.3.6.1.4.1.99999.1.1.0"    # storage capacity %
    ]
    walk => [
      "1.3.6.1.2.1.2.2"             # ifTable (ifDescr/ifOperStatus/ifIn/ifOutOctets)
    ]
    interval => 60
  }
}

filter {
  # [snmp_community] is populated by logstash-integration-snmp (bundled with Logstash 8+/9.x).
  # The community string equals the device name — copy it to device.name.
  mutate {
    copy => { "[snmp_community]" => "device.name" }
  }

  # Enrich vendor/role/site via inline translate dictionary rendered from topology.
  translate {
    field => "device.name"
    destination => "_device_meta"
    dictionary => {
        "cisco-asa-dr" => "cisco|firewall|dr"
        "cisco-rtr-core-01" => "cisco|router|production"
        "cisco-rtr-core-02" => "cisco|router|production"
        "cisco-rtr-dr" => "cisco|router|dr"
        "cisco-sw-access-01" => "cisco|switch|production"
        "cisco-sw-access-02" => "cisco|switch|production"
        "cisco-sw-access-03" => "cisco|switch|production"
        "cisco-sw-dr-01" => "cisco|switch|dr"
        "dell-srv-01" => "dell|server|production"
        "dell-srv-02" => "dell|server|production"
        "dell-storage-01" => "dell|storage|production"
        "dell-storage-dr" => "dell|storage|dr"
        "dell-sw-01" => "dell|switch|production"
        "dell-sw-dr" => "dell|switch|dr"
        "hpe-srv-01" => "hpe|server|production"
        "hpe-srv-02" => "hpe|server|production"
        "hpe-srv-dr-01" => "hpe|server|dr"
        "hpe-storage-01" => "hpe|storage|production"
        "hpe-sw-01" => "hpe|switch|production"
        "palo-fw-prod" => "paloalto|firewall|production"
    }
    fallback => "unknown|unknown|unknown"
  }

  # Split "vendor|role|site" into separate fields.
  mutate {
    split => { "_device_meta" => "|" }
  }
  mutate {
    add_field => {
      "device.vendor" => "%{[_device_meta][0]}"
      "device.role"   => "%{[_device_meta][1]}"
      "device.site"   => "%{[_device_meta][2]}"
    }
    remove_field => ["_device_meta"]
  }
}

output {
  elasticsearch {
    # LS_ES_URL and LS_API_KEY are exported by the Deployment entrypoint shell.
    # LS_API_KEY = base64-decoded ELASTIC_API_KEY (decoded "id:key" form required
    # by the Logstash elasticsearch output api_key parameter).
    hosts    => ["${LS_ES_URL}"]
    api_key  => "${LS_API_KEY}"
    data_stream           => true
    data_stream_type      => "metrics"
    data_stream_dataset   => "snmp.device"
    data_stream_namespace => "default"
  }
}
