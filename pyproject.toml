[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-elastic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "kubernetes>=29.0",
    "pymongo>=4.7",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# snmp: provides snmpsim-command-responder for the snmpsim Deployment.
# pysmi and cryptography are required runtime deps of snmpsim/pysnmp not declared
# in their package metadata.  pysnmp is pulled in transitively but listed explicitly.
snmp = ["snmpsim>=1.1", "pysmi>=0.3", "pysnmp>=4.4", "cryptography>=42"]
dev  = ["pytest>=8.0", "respx>=0.21", "ruff>=0.5", "snmpsim>=1.1", "pysmi>=0.3", "pysnmp>=4.4", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that require live Elastic credentials (skip with '-m not live')",
]

[tool.ruff]
line-length = 100
# "." makes the project root a source root so ruff resolves the `snmp` package
src = ["src", "tests", "."]
